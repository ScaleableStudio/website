# Publishes SideBOX to GitHub Pages at sidebox.scalablestudio.online.
# Runs on every push to main that changes sidebox/ (uploads and deletes on github.com included), or by hand.
# .github/scripts/build-site.js rebuilds the folder list and each folder's page list from what is in the repo,
# so pages appear and disappear with the files. home/ is not published from this repository.
name: SideBOX to Pages

on:
  push:
    branches: [main]
    paths: ["sidebox/**", ".github/workflows/sidebox-pages.yml", ".github/scripts/build-site.js"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build lists from the repository
        run: node .github/scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
